<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Substrate: Tactile Slate Matte Background -->
  <rect width="512" height="512" rx="112" fill="#0C0D10"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1E2026" stroke-width="2"/>

  <!-- ======================================================== -->
  <!-- 1. THE PHONE (Vertical Pillar / Spine of 'F')            -->
  <!-- ======================================================== -->
  <rect x="136" y="112" width="64" height="288" rx="32" fill="#E8EDF2"/>

  <!-- ======================================================== -->
  <!-- 2. THE PC DISPLAY (Horizontal Beam / Top Bar of 'F')     -->
  <!-- ======================================================== -->
  <rect x="220" y="112" width="168" height="64" rx="32" fill="#E8EDF2"/>

  <!-- ======================================================== -->
  <!-- 3. THE "FLICK SLIDER" (Tactile Hardware Toggle Track)    -->
  <!-- A milled toggle slot where the Signal Orange knob is     -->
  <!-- snapped/flicked forward from the phone toward the PC     -->
  <!-- ======================================================== -->
  <!-- Recessed milled groove / track in the chassis -->
  <rect x="200" y="240" width="176" height="48" rx="24" fill="#181B22" stroke="#2B303C" stroke-width="3"/>
  
  <!-- The Flick Knob (Signal Orange Tactile Bead snapped to the right) -->
  <g transform="translate(300, 240)">
    <!-- Orange Glow -->
    <circle cx="24" cy="24" r="32" fill="#FF4400" fill-opacity="0.25" filter="blur(8px)"/>
    <!-- Knob Body -->
    <circle cx="24" cy="24" r="24" fill="#FF4400"/>
    <!-- Machined Grip Dot in Center -->
    <circle cx="24" cy="24" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Speed Ticks behind the flicked knob -->
  <line x1="230" y1="264" x2="250" y2="264" stroke="#53DBC9" stroke-width="4" stroke-linecap="round"/>
  <line x1="264" y1="264" x2="284" y2="264" stroke="#53DBC9" stroke-width="4" stroke-linecap="round"/>
</svg>
