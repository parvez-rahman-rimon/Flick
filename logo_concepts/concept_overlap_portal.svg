<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Substrate: Dark Tactile Hardware Plate -->
  <rect width="512" height="512" rx="112" fill="#101216"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#23272F" stroke-width="2"/>

  <!-- ============================================== -->
  <!-- 1. PC SCREEN (The Large Horizon / Receiver)    -->
  <!-- ============================================== -->
  <!-- PC Monitor frame on the upper right -->
  <rect x="180" y="100" width="224" height="152" rx="20" fill="#171A21" stroke="#333945" stroke-width="4"/>
  <!-- PC Screen Surface -->
  <rect x="194" y="114" width="196" height="124" rx="12" fill="#0D0F13"/>
  <!-- PC Top Bar (Minimize, Maximize, Close Dots) -->
  <circle cx="214" cy="130" r="3.5" fill="#4B525D"/>
  <circle cx="225" cy="130" r="3.5" fill="#4B525D"/>
  <circle cx="236" cy="130" r="3.5" fill="#4B525D"/>
  
  <!-- PC Receiver Target Landing Zone (Glowing soft teal) -->
  <rect x="254" y="148" width="116" height="70" rx="10" fill="#53DBC9" fill-opacity="0.06" stroke="#53DBC9" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="312" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#53DBC9" letter-spacing="1">PASTE</text>

  <!-- ============================================== -->
  <!-- 2. SMARTPHONE (Foreground Sender / Launchpad)  -->
  <!-- ============================================== -->
  <!-- Phone body positioned at the bottom left, overlapping PC -->
  <rect x="108" y="190" width="114" height="222" rx="28" fill="#1C2028" stroke="#3E4554" stroke-width="4" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
  <!-- Phone Screen -->
  <rect x="120" y="210" width="90" height="182" rx="18" fill="#0D0F13"/>
  <!-- Phone Speaker / Dynamic Island Notch -->
  <rect x="145" y="199" width="40" height="5" rx="2.5" fill="#4B525D"/>
  <!-- Phone Home Bar -->
  <rect x="145" y="380" width="40" height="4" rx="2" fill="#4B525D"/>

  <!-- ============================================== -->
  <!-- 3. THE "FLICK" (Effortless Arc & Airborne File)-->
  <!-- ============================================== -->
  <!-- Spring launch curve emerging from phone screen -->
  <path d="M 165 300 C 165 240 220 220 280 200" stroke="#FF4400" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 6"/>

  <!-- Airborne Data Card flying from Phone into PC Landing Zone -->
  <g transform="translate(262, 160) rotate(-6)">
    <!-- Glow -->
    <rect x="-4" y="-4" width="84" height="56" rx="12" fill="#FF4400" fill-opacity="0.25" filter="blur(8px)"/>
    <!-- Card Body -->
    <rect width="76" height="48" rx="10" fill="#FF4400"/>
    <!-- Card Corner Fold -->
    <path d="M 56 0 L 76 20 H 64 C 59.58 20 56 16.42 56 12 V 0 Z" fill="#FFA585"/>
    <!-- Content Lines -->
    <rect x="12" y="14" width="34" height="4" rx="2" fill="#FFFFFF"/>
    <rect x="12" y="24" width="44" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>

  <!-- Instant Snap Ripple Ring (তুড়ির রিং) around the launching point -->
  <circle cx="165" cy="300" r="14" fill="#FF4400" fill-opacity="0.2"/>
  <circle cx="165" cy="300" r="6" fill="#FF4400"/>

  <!-- Bottom Hardware Specification Tag -->
  <text x="256" y="460" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4B525D" letter-spacing="3">
    PHONE TO PC // ZERO-CLICK
  </text>
</svg>
