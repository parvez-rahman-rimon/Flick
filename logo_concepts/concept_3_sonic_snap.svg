<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Substrate: Tactile Machined Surface -->
  <rect width="512" height="512" rx="112" fill="#141618"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#25282C" stroke-width="3"/>

  <!-- Mechanical Corner Screws (TE hardware touch) -->
  <circle cx="56" cy="56" r="6" fill="#2A2D32"/>
  <line x1="53" y1="56" x2="59" y2="56" stroke="#141618" stroke-width="2"/>
  
  <circle cx="456" cy="56" r="6" fill="#2A2D32"/>
  <line x1="453" y1="56" x2="459" y2="56" stroke="#141618" stroke-width="2"/>
  
  <circle cx="56" cy="456" r="6" fill="#2A2D32"/>
  <line x1="53" y1="456" x2="59" y2="456" stroke="#141618" stroke-width="2"/>
  
  <circle cx="456" cy="456" r="6" fill="#2A2D32"/>
  <line x1="453" y1="456" x2="459" y2="456" stroke="#141618" stroke-width="2"/>

  <!-- Main 'F' Vertical Pillar (The Base Chassis) -->
  <rect x="136" y="120" width="68" height="272" rx="20" fill="#E8EDF2"/>

  <!-- Middle Action Bar (Recessed / flush tactile bar) -->
  <rect x="204" y="238" width="108" height="58" rx="18" fill="#E8EDF2"/>

  <!-- Lower Shear Base of Top Bar -->
  <path d="M 204 120 H 262 L 232 178 H 204 V 120 Z" fill="#E8EDF2"/>

  <!-- The "FLICK" Displaced Kinetic Block (The sheared section propelled forward by the snap) -->
  <!-- Shifted +32px right, -14px up -->
  <g transform="translate(36, -16)">
    <path d="M 276 120 L 246 178 H 360 C 372 178 382 168 382 156 V 142 C 382 130 372 120 360 120 H 276 Z" fill="#E8EDF2"/>
    <!-- Velocity Streak / Wind sheer on the flicked block -->
    <line x1="396" y1="136" x2="424" y2="136" stroke="#FF4400" stroke-width="6" stroke-linecap="round"/>
    <line x1="396" y1="162" x2="414" y2="162" stroke="#FF4400" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- The Snap Spark / Actuator (Bright Orange core revealed in the shear gap) -->
  <circle cx="266" cy="146" r="14" fill="#FF4400"/>
  <circle cx="266" cy="146" r="6" fill="#FFFFFF"/>

  <!-- Subtle Hardware Calibration Grid / Technical Spec Ticks (Bottom) -->
  <g opacity="0.4" fill="#8E959E">
    <circle cx="148" cy="422" r="3"/>
    <circle cx="164" cy="422" r="3"/>
    <circle cx="180" cy="422" r="3"/>
    <circle cx="196" cy="422" r="3"/>
    <text x="220" y="426" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#8E959E" letter-spacing="2">FLICK // 0-LAG</text>
  </g>
</svg>
