<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Substrate: Deep Machined Chassis -->
  <rect width="512" height="512" rx="112" fill="#0E1013"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#1F2329" stroke-width="2"/>

  <!-- ============================================== -->
  <!-- 1. PHONE (Vertical Column / The 'F' Stem)      -->
  <!-- ============================================== -->
  <g id="phone-entity">
    <!-- Phone Chassis (Solid Charcoal) -->
    <rect x="124" y="104" width="80" height="304" rx="26" fill="#1A1D23" stroke="#2E343E" stroke-width="4"/>
    <!-- Phone Screen with soft cyan active tint -->
    <rect x="134" y="126" width="60" height="248" rx="16" fill="#13161C"/>
    <!-- Phone Dynamic Island / Camera Pill -->
    <rect x="150" y="114" width="28" height="5" rx="2.5" fill="#3D4552"/>
    <!-- Active Sender Origin Pulse Dot -->
    <circle cx="164" cy="308" r="14" fill="#53DBC9" fill-opacity="0.2"/>
    <circle cx="164" cy="308" r="6" fill="#53DBC9"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. PC MONITOR (Top Bar of the 'F')             -->
  <!-- ============================================== -->
  <g id="pc-entity">
    <!-- Desktop Display Chassis (Horizontal Screen) -->
    <rect x="236" y="104" width="168" height="116" rx="20" fill="#1A1D23" stroke="#2E343E" stroke-width="4"/>
    <!-- PC Glass Surface -->
    <rect x="248" y="116" width="144" height="92" rx="12" fill="#13161C"/>
    <!-- Window Bar Accent (Top Left 3 Dots) -->
    <circle cx="264" cy="130" r="3.5" fill="#FF5511"/>
    <circle cx="275" cy="130" r="3.5" fill="#E5B800"/>
    <circle cx="286" cy="130" r="3.5" fill="#53DBC9"/>
    <!-- Target Receiver Pulse inside PC -->
    <rect x="264" y="148" width="112" height="44" rx="8" fill="#1E232B" stroke="#53DBC9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- PC Stand Base underneath -->
    <path d="M 306 220 L 302 236 H 338 L 334 220 Z" fill="#2E343E"/>
    <rect x="288" y="236" width="64" height="6" rx="3" fill="#3D4552"/>
  </g>

  <!-- ============================================== -->
  <!-- 3. THE "FLICK" ACTION (Middle Bar of the 'F')  -->
  <!-- Effortless Finger-Flick of a File/Clipboard     -->
  <!-- ============================================== -->
  <!-- Kinetic Arc bridging Phone to the airborne token -->
  <path d="M 164 308 C 164 308 200 308 226 296" stroke="#53DBC9" stroke-width="4" stroke-linecap="round"/>
  
  <!-- The Flicked File / Clipboard Document Token -->
  <g transform="translate(232, 264)">
    <!-- Motion Glow -->
    <rect x="-2" y="-2" width="108" height="68" rx="16" fill="#FF4400" fill-opacity="0.18" filter="blur(10px)"/>
    <!-- Card Body: Clean Signal Orange with subtle rounded bevel -->
    <rect width="104" height="64" rx="14" fill="#FF4400" stroke="#FF6A33" stroke-width="2"/>
    
    <!-- File Dog-Ear / Corner Fold -->
    <path d="M 76 0 L 104 28 H 88 C 81.373 28 76 22.627 76 16 V 0 Z" fill="#FFA585"/>
    
    <!-- Crisp Content Previews inside the card -->
    <rect x="16" y="18" width="46" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="16" y="30" width="62" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="16" y="42" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6"/>
  </g>

  <!-- Upward Flick Velocity Arrows (Effortless trajectory into PC) -->
  <g stroke="#53DBC9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M 352 284 C 368 274 380 252 380 228"/>
    <polyline points="372 236 380 224 388 236"/>
  </g>

  <!-- Ambient Micro-Details (Teenage Engineering Hardware Touch) -->
  <circle cx="56" cy="56" r="4" fill="#252A32"/>
  <circle cx="456" cy="56" r="4" fill="#252A32"/>
  <circle cx="56" cy="456" r="4" fill="#252A32"/>
  <circle cx="456" cy="456" r="4" fill="#252A32"/>

  <!-- Subtitle Label -->
  <text x="256" y="458" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4B525D" letter-spacing="3">
    PHONE ➔ PC // ONE FLICK
  </text>
</svg>
